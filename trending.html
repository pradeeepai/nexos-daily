<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trending Repos · The Nexos Daily</title>
<meta name="description" content="The fastest-growing AI agent and Claude ecosystem repos on GitHub: daily, weekly and monthly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg-2:#f3f2f7;--ink:#0e0d12;--ink-2:#55535e;--line:#e3e1ea;--band:#0e0d12;--on-band:#ffffff;
  --purple:#5b2ef0;--purple-ink:#4a1fd6;--purple-soft:#ece6ff;--on-purple:#ffffff;--up:#0a7a3d;
  --f-display:"Archivo",Impact,"Arial Narrow",sans-serif;
  --f-text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d12;--bg-2:#18171f;--ink:#f1f0f5;--ink-2:#a9a6b5;--line:#2a2833;--band:#000000;--purple:#6d44ff;--purple-ink:#b9a4ff;--purple-soft:#211a3d;--up:#4ad08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d12;--bg-2:#18171f;--ink:#f1f0f5;--ink-2:#a9a6b5;--line:#2a2833;--band:#000000;--purple:#6d44ff;--purple-ink:#b9a4ff;--purple-soft:#211a3d;--up:#4ad08a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.band{background:var(--band);color:var(--on-band)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:calc(14px + env(safe-area-inset-top,0px)) 12px}
.word{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--on-band)}
.word b{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:clamp(40px,8vw,80px);line-height:.85;text-transform:uppercase}
.word i{font-style:normal;font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:clamp(15px,2.2vw,22px);text-transform:uppercase;color:#b9a4ff;letter-spacing:.04em}
.back{color:rgba(255,255,255,.85);font-size:14px;font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 14px}
.back:hover{background:#fff;color:#0e0d12}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;padding-bottom:12px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.meta select{background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:999px;color:#fff;padding:3px 10px;font-size:13px;font-weight:600}
.meta select option{color:#0e0d12}
.rail{position:sticky;top:0;z-index:5;background:var(--purple)}
.rail .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;height:48px;padding:0 16px;border:0;background:none;cursor:pointer;color:var(--on-purple);font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:17px;letter-spacing:.04em;text-transform:uppercase;border-bottom:4px solid transparent}
.tab[aria-selected="true"]{border-bottom-color:#fff}
.tab:hover{border-bottom-color:rgba(255,255,255,.5)}
h1{margin:26px 0 4px;font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(38px,6vw,60px);line-height:.95;text-transform:uppercase}
h1 span{color:var(--purple-ink)}
.lede{margin:0 0 16px;color:var(--ink-2);max-width:60ch}
.topics{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.topics .lbl{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:18px;text-transform:uppercase;color:var(--purple-ink);margin-right:4px}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:var(--on-purple)}
.kinds{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 4px}
ol.list{list-style:none;margin:8px 0 40px;padding:0;counter-reset:n}
.repo{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line);counter-increment:n}
.repo::before{content:counter(n);font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:42px;line-height:.9;color:var(--purple-ink)}
.repo h2{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:22px;line-height:1.15;word-break:break-word}
.repo h2 a{text-decoration:none}
.repo h2 a:hover{color:var(--purple-ink);text-decoration:underline}
.repo p{margin:6px 0 0;max-width:68ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.tag{background:var(--bg-2);border-radius:999px;padding:2px 10px;font-weight:600}
.tag.kind{background:var(--purple-soft);color:var(--purple-ink)}
.nums{text-align:right;white-space:nowrap}
.gain{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:24px;color:var(--up);font-variant-numeric:tabular-nums}
.stars{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
@media (max-width:560px){.repo{grid-template-columns:36px minmax(0,1fr)}.repo::before{font-size:32px}.nums{grid-column:2;text-align:left;display:flex;gap:10px;align-items:baseline}}
.spark{display:block;margin:6px 0 2px auto;color:var(--purple-ink)}
@media (max-width:560px){.spark{margin:0}}
.links{display:flex;gap:8px}
.empty{padding:56px 0;text-align:center;color:var(--ink-2)}
.empty h2{margin:0 0 6px;font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:36px;text-transform:uppercase;color:var(--ink)}
footer{background:var(--band);color:rgba(255,255,255,.72);font-size:13px}
footer .wrap{padding-block:22px calc(22px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<header class="band">
  <div class="wrap top">
    <a class="word" href="./"><b>Nexos</b><i>Trending</i></a>
    <span class="links"><a class="back" href="tracker.html">Tracker</a><a class="back" href="./">← The paper</a></span>
  </div>
  <div class="wrap meta"><span id="when">Loading</span><label>Snapshot <select id="pick" aria-label="Snapshot date"></select></label></div>
</header>
<nav class="rail" aria-label="Period"><div class="wrap" role="tablist" id="tabs">
  <button class="tab" role="tab" data-p="daily" aria-selected="true">Daily</button>
  <button class="tab" role="tab" data-p="weekly" aria-selected="false">Weekly</button>
  <button class="tab" role="tab" data-p="monthly" aria-selected="false">Monthly</button>
</div></nav>
<main class="wrap" id="main"><div class="empty"><h2>Loading</h2><p>Fetching the trending list.</p></div></main>
<footer><div class="wrap">Updated every morning at about 8:20 am IST from GitHub Trending and GitHub search. AI desks pick and describe each repo, so check the repo before you install anything.</div></footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const safeUrl = u => /^https:\/\/(github\.com|[a-z0-9.-]+)\//i.test(String(u || "")) ? String(u) : "";
const num = n => typeof n === "number" ? n.toLocaleString("en-IN") : "–";
const LABEL = { daily: "today", weekly: "this week", monthly: "this month" };
const S = { dates: [], date: null, data: null, period: "daily", kind: null, hist: {} };
const series = repo => { const h = S.hist[repo]; return h && h.s ? Object.entries(h.s).sort((a, b) => a[0].localeCompare(b[0])) : []; };
function growth(repo, days) { const s = series(repo); if (s.length < 2) return null; const last = s[s.length - 1]; const cut = new Date(new Date(last[0] + "T00:00:00Z") - days * 864e5).toISOString().slice(0, 10); const base = s.filter(x => x[0] <= cut).pop() || (s[0][0] <= cut ? s[0] : null); return base ? last[1] - base[1] : null; }
function spark(repo) { const s = series(repo).slice(-30); if (s.length < 2) return ""; const v = s.map(x => x[1]), lo = Math.min(...v), hi = Math.max(...v), w = 96, h = 28;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 2 - (hi === lo ? 0.5 : (y - lo) / (hi - lo)) * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Stars over the last ${s.length} days"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`; }
function fmt(k) { return new Date(k + "T12:00:00+05:30").toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Kolkata" }); }
function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.p === S.period));
  if (!S.data) { $("main").innerHTML = `<div class="empty"><h2>No list yet</h2><p>The first trending list prints tomorrow morning.</p></div>`; return; }
  $("when").textContent = fmt(S.date);
  const per = (S.data.periods || {})[S.period] || {}, repos = Array.isArray(per.repos) ? per.repos : [], topics = Array.isArray(per.topics) ? per.topics : [];
  const kinds = [...new Set(repos.map(r => r.kind).filter(Boolean))];
  if (S.kind && !kinds.includes(S.kind)) S.kind = null;
  const list = repos.filter(r => !S.kind || r.kind === S.kind);
  $("main").innerHTML = `<h1>Growing <span>${esc(LABEL[S.period])}</span></h1>
    <p class="lede">The fastest-rising repos in the AI agent and Claude ecosystem${S.data.headline ? ". " + esc(S.data.headline) : "."}</p>
    ${topics.length ? `<div class="topics"><span class="lbl">Rising topics</span>${topics.map(t => `<span class="chip" style="cursor:default">${esc(t)}</span>`).join("")}</div>` : ""}
    ${kinds.length > 1 ? `<div class="kinds">${["All"].concat(kinds).map(k => `<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="${(k === "All" && !S.kind) || k === S.kind}">${esc(k)}</button>`).join("")}</div>` : ""}
    ${list.length ? `<ol class="list">${list.map(r => { const u = safeUrl(r.url) || ("https://github.com/" + String(r.repo || "").replace(/[^\w.\-\/]/g, ""));
      return `<li class="repo"><div><h2><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(r.repo)}</a></h2>${r.description ? `<p>${esc(r.description)}</p>` : ""}
        <div class="tags">${r.kind ? `<span class="tag kind">${esc(r.kind)}</span>` : ""}${r.language ? `<span class="tag">${esc(r.language)}</span>` : ""}${r.source ? `<span>${esc(r.source)}</span>` : ""}</div></div>
        <div class="nums">${typeof r.gained === "number" ? `<div class="gain">+${num(r.gained)}</div>` : ""}<div class="stars">★ ${num(r.stars)}</div>${spark(r.repo)}${(() => { const g7 = growth(r.repo, 7), g30 = growth(r.repo, 30); return g7 != null || g30 != null ? `<div class="stars">${g7 != null ? `+${num(g7)} in 7 days` : ""}${g7 != null && g30 != null ? " · " : ""}${g30 != null ? `+${num(g30)} in 30 days` : ""}</div>` : ""; })()}</div></li>`; }).join("")}</ol>`
      : `<div class="empty"><h2>Nothing here</h2><p>No repo for this period in this snapshot.</p></div>`}`;
}
async function load(date) {
  S.date = date;
  try { S.data = await (await fetch(`trending/${date}.json`, { cache: "no-cache" })).json(); } catch (e) { S.data = null; }
  render();
}
document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-p]"); if (t) { S.period = t.dataset.p; S.kind = null; try { history.replaceState(null, "", "#" + S.period); } catch (_) {} render(); return; }
  const k = e.target.closest && e.target.closest("[data-k]"); if (k) { S.kind = k.dataset.k === "All" ? null : k.dataset.k; render(); }
});
$("pick").addEventListener("change", e => load(e.target.value));
(async function boot() {
  const h = (location.hash || "").slice(1); if (LABEL[h]) S.period = h;
  try { S.hist = ((await (await fetch("stars/history.json", { cache: "no-cache" })).json()).repos || {}); } catch (e) { S.hist = {}; }
  try { S.dates = ((await (await fetch("trending/index.json", { cache: "no-cache" })).json()).dates || []).slice().sort().reverse(); } catch (e) { S.dates = []; }
  $("pick").innerHTML = S.dates.map(d => `<option value="${esc(d)}">${esc(new Date(d + "T12:00:00+05:30").toLocaleDateString("en-IN", { day: "numeric", month: "short" }))}</option>`).join("");
  if (S.dates.length) load(S.dates[0]); else { $("when").textContent = "No snapshot yet"; render(); }
})();
</script>
</body>
</html>
