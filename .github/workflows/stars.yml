name: Star history
on:
  push:
    branches: [main]
    paths: ["stars/tracked.json"]
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take star snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stars.py
      - name: Commit
        run: |
          git config user.name "nexos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Star snapshot $(date -u +%F)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
