name: Audio briefing
on:
  push:
    branches: [main]
    paths: ["editions/20*.json", "scripts/tts.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  speak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q "kokoro>=0.9" soundfile numpy "preshed==3.0.13"
      - name: Make the briefing
        run: |
          set -o pipefail
          python3 scripts/tts.py 2>&1 | tee /tmp/tts.log || { echo "::error::$(tail -c 2500 /tmp/tts.log | tr '\n' '|')"; exit 1; }
      - name: Commit
        run: |
          git config user.name "nexos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          git diff --cached --quiet && exit 0
          git commit -m "Audio briefing $(date -u +%F)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
